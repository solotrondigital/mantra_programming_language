[workspace]
members = [
    "crates/mantrac_lexer",
    "crates/mantrac_ast",
    "crates/mantrac_parser",
    "crates/mantrac_checker",
    "crates/mantrac_vm",
    "crates/mantrac_codegen",
    "crates/mantrac",
    "crates/mantra_mdk",
    "crates/mantra_sql_orm",
    "crates/mantra_web",
    "crates/mantra_rest",
    "crates/mantrac_ir",
    "crates/mantra_debugger",
    "crates/mantra_bootstrap",
    "crates/mantra_lsp",
    "crates/mantra_mobile",
    "crates/mantra_graphql",
    "crates/mantra_widgets",
    "crates/mantra_ai",
    "crates/mantra_util",
    "crates/mantra_email",
    "crates/mantra_intelligence",
    "crates/mantra_agents",
    "crates/mantra_ml",
]
resolver = "2"

[workspace.package]
version = "0.8.0"
description = "AI-native programming language and toolchain"
license = "MIT OR GPL-3.0"

[workspace.metadata.mantra]
forced-update = true
