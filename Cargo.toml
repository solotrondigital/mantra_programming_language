[workspace]
members = [
    "crates/mantrac_lexer",
    "crates/mantrac_ast",
    "crates/mantrac_parser",
    "crates/mantrac_checker",
    "crates/mantrac_vm",
    "crates/mantrac_codegen",
    "crates/mantrac",
    "crates/mantra_mdk",
    "crates/mantra_sql_orm",
    "crates/mantra_web",
    "crates/mantra_rest",
    "crates/mantrac_ir",
    "crates/mantra_debugger",
    "crates/mantra_bootstrap",
    "crates/mantra_lsp",
    "crates/mantra_mobile",
    "crates/mantra_graphql",
    "crates/mantra_widgets",
]
resolver = "2"

[workspace.package]
name = "mantra_programming_languague"
version = "0.7.0"
edition = "2021"
forced-update = true
description = "Mantra v0.7.0— Mantra a Programming Language"
license = "MIT OR GPL-3.0"
