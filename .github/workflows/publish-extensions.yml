name: Publish Mantra IDE Extensions

on:
  push:
    branches:
      - main
      - mantra_intelligence
    paths:
      - 'tooling/ide/**'
      - 'tooling/grammars/**'
      - 'tooling/themes/**'
      - '.github/workflows/publish-extensions.yml'
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Attempt publishing the current extension version (registries reject versions already published)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  check-and-publish:
    name: Check Version & Publish to Extension Registries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check for Version Changes
        id: version_check
        shell: bash
        run: |
          python3 scripts/release/sync_versions.py

          FORCE="${{ github.event.inputs.force_publish }}"
          LANG_VER=$(jq -r '.version' tooling/ide/vscode/package.json)
          CLI_VER=$(jq -r '.version' tooling/ide/vscode-cli/package.json)
          echo "Current Language Support Version: $LANG_VER"
          echo "Current CLI Extension Version: $CLI_VER"

          PUBLISH_LANG="false"
          PUBLISH_CLI="false"

          if [ "$FORCE" = "true" ]; then
            echo "Force publish requested."
            PUBLISH_LANG="true"
            PUBLISH_CLI="true"
          else
            set +e
            HAS_PARENT=0
            git rev-parse --verify HEAD~1 >/dev/null 2>&1 && HAS_PARENT=1

            if [ "$HAS_PARENT" -eq 1 ]; then
              PREV_LANG_VER=$(git show HEAD~1:tooling/ide/vscode/package.json 2>/dev/null | jq -r '.version // empty')
              PREV_CLI_VER=$(git show HEAD~1:tooling/ide/vscode-cli/package.json 2>/dev/null | jq -r '.version // empty')
              set -e

              echo "Previous Language Support Version: $PREV_LANG_VER"
              echo "Previous CLI Extension Version: $PREV_CLI_VER"

              if [ -z "$PREV_LANG_VER" ] || [ "$LANG_VER" != "$PREV_LANG_VER" ]; then
                echo ">> Detected version update in Mantra Language Support ($PREV_LANG_VER -> $LANG_VER)"
                PUBLISH_LANG="true"
              fi

              if [ -z "$PREV_CLI_VER" ] || [ "$CLI_VER" != "$PREV_CLI_VER" ]; then
                echo ">> Detected version update in Mantra CLI Extension ($PREV_CLI_VER -> $CLI_VER)"
                PUBLISH_CLI="true"
              fi
            else
              set -e
              echo "Initial commit or single commit push detected; enabling publish."
              PUBLISH_LANG="true"
              PUBLISH_CLI="true"
            fi
          fi

          echo "publish_lang=$PUBLISH_LANG" >> $GITHUB_OUTPUT
          echo "publish_cli=$PUBLISH_CLI" >> $GITHUB_OUTPUT
          echo "lang_version=$LANG_VER" >> $GITHUB_OUTPUT
          echo "cli_version=$CLI_VER" >> $GITHUB_OUTPUT

      # ─── Build & Package: Mantra Language Support ──────────────────────────
      - name: Build & Package Mantra Language Support
        if: steps.version_check.outputs.publish_lang == 'true'
        shell: bash
        run: |
          cd tooling/ide/vscode
          npm ci || npm install
          npm run compile
          npx vsce package --allow-missing-repository --baseImagesUrl https://www.solotrontech.com --baseContentUrl https://www.solotrontech.com --out ../../../mantra-language-support-${{ steps.version_check.outputs.lang_version }}.vsix

      # ─── Build & Package: Mantra CLI Extension ─────────────────────────────
      - name: Build & Package Mantra CLI Extension
        if: steps.version_check.outputs.publish_cli == 'true'
        shell: bash
        run: |
          cd tooling/ide/vscode-cli
          npm ci || npm install
          npm run compile
          npx vsce package --allow-missing-repository --baseImagesUrl https://www.solotrontech.com --baseContentUrl https://www.solotrontech.com --out ../../../mantra-cli-${{ steps.version_check.outputs.cli_version }}.vsix

      # ─── Upload Built VSIX Artifacts ───────────────────────────────────────
      - name: Upload Extension VSIX Artifacts
        if: steps.version_check.outputs.publish_lang == 'true' || steps.version_check.outputs.publish_cli == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mantra-vscode-extensions
          path: ./*.vsix

      # Step-level secrets cannot be used in the step's `if` expression. Run the
      # publish step for changed packages, then report a clear warning if its token
      # has not been configured.
      - name: Publish to Visual Studio Marketplace
        if: steps.version_check.outputs.publish_lang == 'true' || steps.version_check.outputs.publish_cli == 'true'
        env:
          VS_MARKETPLACE_TOKEN: ${{ secrets.VS_MARKETPLACE_TOKEN }}
          LANG_VERSION: ${{ steps.version_check.outputs.lang_version }}
          CLI_VERSION: ${{ steps.version_check.outputs.cli_version }}
          PUBLISH_LANG: ${{ steps.version_check.outputs.publish_lang }}
          PUBLISH_CLI: ${{ steps.version_check.outputs.publish_cli }}
        shell: bash
        run: |
          if [ -z "$VS_MARKETPLACE_TOKEN" ]; then
            echo "::warning::VS_MARKETPLACE_TOKEN is not configured; VS Code Marketplace publishing was skipped."
            exit 0
          fi
          if [ "$PUBLISH_LANG" = "true" ]; then
            (cd tooling/ide/vscode && npx vsce publish --packagePath "$GITHUB_WORKSPACE/mantra-language-support-${LANG_VERSION}.vsix" -p "$VS_MARKETPLACE_TOKEN")
          fi
          if [ "$PUBLISH_CLI" = "true" ]; then
            (cd tooling/ide/vscode-cli && npx vsce publish --packagePath "$GITHUB_WORKSPACE/mantra-cli-${CLI_VERSION}.vsix" -p "$VS_MARKETPLACE_TOKEN")
          fi

      - name: Publish to Open VSX Registry
        if: steps.version_check.outputs.publish_lang == 'true' || steps.version_check.outputs.publish_cli == 'true'
        env:
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
          LANG_VERSION: ${{ steps.version_check.outputs.lang_version }}
          CLI_VERSION: ${{ steps.version_check.outputs.cli_version }}
          PUBLISH_LANG: ${{ steps.version_check.outputs.publish_lang }}
          PUBLISH_CLI: ${{ steps.version_check.outputs.publish_cli }}
        shell: bash
        run: |
          if [ -z "$OPEN_VSX_TOKEN" ]; then
            echo "::warning::OPEN_VSX_TOKEN is not configured; Open VSX publishing was skipped."
            exit 0
          fi
          if [ "$PUBLISH_LANG" = "true" ]; then
            npx --yes ovsx publish "mantra-language-support-${LANG_VERSION}.vsix" -p "$OPEN_VSX_TOKEN"
          fi
          if [ "$PUBLISH_CLI" = "true" ]; then
            npx --yes ovsx publish "mantra-cli-${CLI_VERSION}.vsix" -p "$OPEN_VSX_TOKEN"
          fi

