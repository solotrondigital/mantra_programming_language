name: Publish Mantra IDE Extensions

on:
  push:
    branches: [main]
    paths:
      - 'tooling/ide/**'
      - 'tooling/grammars/**'
      - 'tooling/themes/**'
      - '.github/workflows/publish-extensions.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tooling/ide/**'
      - 'tooling/grammars/**'
      - 'tooling/themes/**'
      - '.github/workflows/publish-extensions.yml'
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Attempt publishing the current extension version (registries reject versions already published)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  check-and-publish:
    name: Check Version & Publish to Extension Registries
    runs-on: ubuntu-latest
    # OPEN_VSX_TOKEN and VS_MARKETPLACE_TOKEN are stored as environment secrets.
    # A job must target that environment for GitHub to expose those secrets.
    environment: production

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Published Registry Versions
        id: version_check
        env:
          FORCE_PUBLISH: ${{ github.event.inputs.force_publish || 'false' }}
        shell: bash
        run: |
          python3 scripts/release/sync_versions.py
          python3 scripts/release/check_extension_registry_versions.py

      # ─── Build & Package: Mantra Language Support ──────────────────────────
      - name: Build & Package Mantra Language Support
        if: steps.version_check.outputs.publish_lang_marketplace == 'true' || steps.version_check.outputs.publish_lang_open_vsx == 'true'
        shell: bash
        run: |
          cd tooling/ide/vscode
          npm ci || npm install
          npm run compile
          npx vsce package --allow-missing-repository --baseImagesUrl https://www.solotrontech.com --baseContentUrl https://www.solotrontech.com --out ../../../mantra-language-support-${{ steps.version_check.outputs.lang_version }}.vsix

      # ─── Build & Package: Mantra CLI Extension ─────────────────────────────
      - name: Build & Package Mantra CLI Extension
        if: steps.version_check.outputs.publish_cli_marketplace == 'true' || steps.version_check.outputs.publish_cli_open_vsx == 'true'
        shell: bash
        run: |
          cd tooling/ide/vscode-cli
          npm ci || npm install
          npm run compile
          npx vsce package --allow-missing-repository --baseImagesUrl https://www.solotrontech.com --baseContentUrl https://www.solotrontech.com --out ../../../mantra-cli-${{ steps.version_check.outputs.cli_version }}.vsix

      # ─── Upload Built VSIX Artifacts ───────────────────────────────────────
      - name: Upload Extension VSIX Artifacts
        if: steps.version_check.outputs.publish_lang_marketplace == 'true' || steps.version_check.outputs.publish_lang_open_vsx == 'true' || steps.version_check.outputs.publish_cli_marketplace == 'true' || steps.version_check.outputs.publish_cli_open_vsx == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mantra-vscode-extensions
          path: ./*.vsix

      # Step-level secrets cannot be used in the step's `if` expression. Run the
      # publish step for changed packages, then report a clear warning if its token
      # has not been configured.
      - name: Publish to Visual Studio Marketplace
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (steps.version_check.outputs.publish_lang_marketplace == 'true' || steps.version_check.outputs.publish_cli_marketplace == 'true')
        env:
          VS_MARKETPLACE_TOKEN: ${{ secrets.VS_MARKETPLACE_TOKEN }}
          LANG_VERSION: ${{ steps.version_check.outputs.lang_version }}
          CLI_VERSION: ${{ steps.version_check.outputs.cli_version }}
          PUBLISH_LANG: ${{ steps.version_check.outputs.publish_lang_marketplace }}
          PUBLISH_CLI: ${{ steps.version_check.outputs.publish_cli_marketplace }}
        shell: bash
        run: |
          if [ -z "$VS_MARKETPLACE_TOKEN" ]; then
            echo "::warning::VS_MARKETPLACE_TOKEN is not configured; VS Code Marketplace publishing was skipped."
            exit 0
          fi
          if [ "$PUBLISH_LANG" = "true" ]; then
            (cd tooling/ide/vscode && npx vsce publish --packagePath "$GITHUB_WORKSPACE/mantra-language-support-${LANG_VERSION}.vsix" -p "$VS_MARKETPLACE_TOKEN")
          fi
          if [ "$PUBLISH_CLI" = "true" ]; then
            (cd tooling/ide/vscode-cli && npx vsce publish --packagePath "$GITHUB_WORKSPACE/mantra-cli-${CLI_VERSION}.vsix" -p "$VS_MARKETPLACE_TOKEN")
          fi

      - name: Publish to Open VSX Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (steps.version_check.outputs.publish_lang_open_vsx == 'true' || steps.version_check.outputs.publish_cli_open_vsx == 'true')
        env:
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
          LANG_VERSION: ${{ steps.version_check.outputs.lang_version }}
          CLI_VERSION: ${{ steps.version_check.outputs.cli_version }}
          PUBLISH_LANG: ${{ steps.version_check.outputs.publish_lang_open_vsx }}
          PUBLISH_CLI: ${{ steps.version_check.outputs.publish_cli_open_vsx }}
        shell: bash
        run: |
          if [ -z "$OPEN_VSX_TOKEN" ]; then
            echo "::warning::OPEN_VSX_TOKEN is not configured; Open VSX publishing was skipped."
            exit 0
          fi
          if [ "$PUBLISH_LANG" = "true" ]; then
            npx --yes ovsx publish "mantra-language-support-${LANG_VERSION}.vsix" -p "$OPEN_VSX_TOKEN"
          fi
          if [ "$PUBLISH_CLI" = "true" ]; then
            npx --yes ovsx publish "mantra-cli-${CLI_VERSION}.vsix" -p "$OPEN_VSX_TOKEN"
          fi

