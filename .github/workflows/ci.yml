name: Mantra Cross-Platform Build, Test & Install CI

on:
  push:
    branches: [ main, release-*, mantra_intelligence ]
  pull_request:
    branches: [ main, mantra_intelligence ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test-matrix:
    name: Test (${{ matrix.os }} · ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon
          - os: macos-14
            target: aarch64-apple-darwin
            c_compiler: clang
          # macOS Intel
          - os: macos-13
            target: x86_64-apple-darwin
            c_compiler: clang
          # Linux x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            c_compiler: gcc
          # Linux aarch64
          - os: ubuntu-24.04-arm64
            target: aarch64-unknown-linux-gnu
            c_compiler: gcc
          # Windows MSVC
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            c_compiler: cl

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Python for release version checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build All Workspace Crates (Release)
        run: cargo build --release

      - name: Verify Cargo workspace versions
        shell: bash
        run: python scripts/release/version_config.py verify

      - name: Run Rust Tests (skip AI provider/model package)
        run: cargo test --workspace --exclude mantra_ai

      - name: Run Core Conformance & MDK Tests
        shell: bash
        run: |
          chmod +x tests/run_all.sh
          tests/run_all.sh

      - name: Check Public ABI Header from C11 and C++11
        shell: bash
        run: bash tests/abi/check_header.sh

      - name: Run Extended Fuzz, Stress & Performance Suite
        shell: bash
        run: |
          chmod +x tests/run_extended_suite.sh
          tests/run_extended_suite.sh

      - name: Verify MDK CLI Commands
        shell: bash
        run: |
          ROOT_DIR="$(pwd)"
          INSTALL_BIN="$RUNNER_TEMP/mantra-install/bin"
          mkdir -p "$INSTALL_BIN"
          for executable in mantra mantrac mantra-lsp; do
            if [ -f "$ROOT_DIR/target/release/${executable}.exe" ]; then
              cp "$ROOT_DIR/target/release/${executable}.exe" "$INSTALL_BIN/"
            elif [ -f "$ROOT_DIR/target/release/$executable" ]; then
              cp "$ROOT_DIR/target/release/$executable" "$INSTALL_BIN/"
            fi
          done
          echo "$INSTALL_BIN" >> "$GITHUB_PATH"
          export PATH="$INSTALL_BIN:$PATH"
          EXPECTED_VERSION="$(python scripts/release/version_config.py version)"
          mantra --version | tee /tmp/mantra-version.txt
          mantrac --version | tee /tmp/mantrac-version.txt
          grep -F "v${EXPECTED_VERSION}" /tmp/mantra-version.txt
          grep -F "${EXPECTED_VERSION}" /tmp/mantrac-version.txt
          TEST_APP_DIR="$RUNNER_TEMP/ci_test_app"
          rm -rf "$TEST_APP_DIR"
          mantra create --type standalone --org com.ci --project-name ci_test_app "$TEST_APP_DIR"
          cd "$TEST_APP_DIR"
          mantra check
          mantra test
          mantra lock
          mantra audit

