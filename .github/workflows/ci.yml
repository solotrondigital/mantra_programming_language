name: Mantra Toolchain CI

on:
  push:
    branches: [ main, release-* ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test-matrix:
    name: Test (${{ matrix.os }} · ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon
          - os: macos-14
            target: aarch64-apple-darwin
            c_compiler: clang
          # macOS Intel
          - os: macos-13
            target: x86_64-apple-darwin
            c_compiler: clang
          # Linux x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            c_compiler: gcc
          # Linux aarch64
          - os: ubuntu-24.04-arm64
            target: aarch64-unknown-linux-gnu
            c_compiler: gcc
          # Windows MSVC
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            c_compiler: cl

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build All Workspace Crates (Release)
        run: cargo build --release

      - name: Run Core Conformance & MDK Tests
        shell: bash
        run: |
          chmod +x tests/run_all.sh
          tests/run_all.sh

      - name: Run Extended Fuzz, Stress & Performance Suite
        shell: bash
        run: |
          chmod +x tests/run_extended_suite.sh
          tests/run_extended_suite.sh

      - name: Verify MDK CLI Commands
        shell: bash
        run: |
          ./target/release/mantra --version
          ./target/release/mantrac --version
          ./target/release/mantra new /tmp/ci_test_app
          cd /tmp/ci_test_app
          ../../target/release/mantra check
          ../../target/release/mantra test
          ../../target/release/mantra audit

