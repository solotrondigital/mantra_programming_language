name: Production Release

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/release/**'
      - '.github/workflows/**'
      - 'create_installers.sh'
      - 'distribution/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Must match workspace.package.version in Cargo.toml'
        required: false
        default: ''

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8
  CARGO_TERM_COLOR: always

jobs:
  release-gate:
    name: Resolve workspace version and release gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gate.outputs.version }}
      forced_update: ${{ steps.gate.outputs.forced_update }}
      should_release: ${{ steps.gate.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Synchronize and validate Cargo workspace versions
        run: |
          python scripts/release/sync_versions.py
          python scripts/release/version_config.py verify
      - name: Check release version and existing GitHub release
        id: gate
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(python scripts/release/version_config.py version)"
          FORCED_UPDATE="$(python scripts/release/version_config.py forced-update)"
          REQUESTED_VERSION="${{ inputs.version }}"
          if [[ -n "$REQUESTED_VERSION" && "${REQUESTED_VERSION#v}" != "$VERSION" ]]; then
            echo "Requested version $REQUESTED_VERSION does not match Cargo workspace version $VERSION" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF_NAME#v}" != "$VERSION" ]]; then
            echo "Git tag $GITHUB_REF_NAME does not match Cargo workspace version $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "forced_update=$FORCED_UPDATE" >> "$GITHUB_OUTPUT"
          python scripts/release/check_release_status.py
      - name: Require release signing credentials
        if: steps.gate.outputs.should_release == 'true'
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_KEY_ID: ${{ secrets.RELEASE_GPG_KEY_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          missing=()
          for name in RELEASE_GPG_PRIVATE_KEY RELEASE_GPG_KEY_ID APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_TEAM_ID APPLE_ID APPLE_APP_PASSWORD WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            printf 'Missing required release signing secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

  build-and-package:
    name: Build & Package (${{ matrix.platform }})
    needs: release-gate
    if: needs.release-gate.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos
          - os: ubuntu-22.04
            platform: linux
          - os: windows-2022
            platform: windows
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synchronize and verify workspace package versions
        shell: bash
        run: |
          python scripts/release/sync_versions.py
          python scripts/release/version_config.py verify
      - name: Build toolchain
        shell: bash
        run: |
          cargo build --release

      - name: Sign macOS binaries
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/mantra-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          for binary in target/release/mantra target/release/mantrac; do
            codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$binary"
            codesign --verify --strict --verbose=2 "$binary"
          done

      - name: Sign Windows binaries
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'mantra-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw 'Windows SDK signtool.exe was not found.' }
          foreach ($binary in @('target\release\mantra.exe', 'target\release\mantrac.exe')) {
            & $signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certificatePath /p $env:WINDOWS_CERTIFICATE_PASSWORD $binary
            if ($LASTEXITCODE -ne 0) { throw "Signing failed for $binary" }
            & $signtool verify /pa /v $binary
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $binary" }
          }

      - name: Package signed toolchain and installer
        shell: bash
        env:
          VERSION: ${{ needs.release-gate.outputs.version }}
        run: |
          chmod +x create_installers.sh
          ./create_installers.sh "$VERSION"
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            WINDOWS_PACKAGE="dist/releases/v${VERSION}/mantra-${VERSION}-windows.zip"
            if [[ ! -s "$WINDOWS_PACKAGE" ]]; then
              echo "Windows package was not created: $WINDOWS_PACKAGE" >&2
              exit 1
            fi
            echo "Verified Windows release package: $WINDOWS_PACKAGE"
          fi
          MANTRA_BIN=target/release/mantra
          MANTRAC_BIN=target/release/mantrac
          if [[ -f "${MANTRA_BIN}.exe" ]]; then MANTRA_BIN="${MANTRA_BIN}.exe"; fi
          if [[ -f "${MANTRAC_BIN}.exe" ]]; then MANTRAC_BIN="${MANTRAC_BIN}.exe"; fi
          "./$MANTRA_BIN" --version | grep -F "v$VERSION"
          "./$MANTRAC_BIN" --version | grep -F "$VERSION"

      - name: Notarize and staple macOS installer
        if: matrix.platform == 'macos'
        shell: bash
        env:
          VERSION: ${{ needs.release-gate.outputs.version }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG="dist/releases/v${VERSION}/Mantra-${VERSION}-macOS.dmg"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
      - name: Upload macOS installer
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: |
            dist/releases/v${{ needs.release-gate.outputs.version }}/Mantra-${{ needs.release-gate.outputs.version }}-macOS.dmg
          if-no-files-found: error
      - name: Upload Linux installer
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: |
            dist/releases/v${{ needs.release-gate.outputs.version }}/mantra-${{ needs.release-gate.outputs.version }}-linux.tar.gz
            dist/releases/v${{ needs.release-gate.outputs.version }}/mantra-installer-linux.sh
          if-no-files-found: error
      - name: Upload Windows installer
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: |
            dist/releases/v${{ needs.release-gate.outputs.version }}/mantra-${{ needs.release-gate.outputs.version }}-windows.zip
          if-no-files-found: error

  publish-release:
    name: Assemble and publish GitHub release
    needs: [release-gate, build-and-package]
    if: needs.release-gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist/staging
          merge-multiple: true
      - name: Assemble release metadata
        shell: bash
        env:
          VERSION: ${{ needs.release-gate.outputs.version }}
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.RELEASE_GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          REQUIRE_GPG_SIGNATURE: 'true'
        run: |
          mkdir -p "dist/releases/v$VERSION"
          cp dist/staging/* "dist/releases/v$VERSION/"
          printf '%s' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
          bash ./scripts/release/sign_release.sh "$VERSION"
          test -s "dist/releases/v$VERSION/SHA256SUMS.asc"
          test -s "dist/releases/v$VERSION/release.json.asc"
      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release-gate.outputs.version }}
          name: Mantra v${{ needs.release-gate.outputs.version }} — Production Release
          files: dist/releases/v${{ needs.release-gate.outputs.version }}/*
          overwrite_files: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-chocolatey:
    name: Publish Chocolatey package
    needs: [release-gate, publish-release]
    if: needs.publish-release.result == 'success'
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout released source
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.release-gate.outputs.version }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download Windows release asset and build Chocolatey package
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release-gate.outputs.version }}
        run: |
          mkdir -p "dist/releases/v$VERSION"
          gh release download "v$VERSION" --pattern "mantra-${VERSION}-windows.zip" --dir "dist/releases/v$VERSION"
          python scripts/release/package_chocolatey.py "$VERSION"
          python - "$VERSION" <<'PY'
          import sys, zipfile, xml.etree.ElementTree as ET
          version = sys.argv[1]
          package = f"dist/releases/v{version}/mantra.{version}.nupkg"
          with zipfile.ZipFile(package) as archive:
              nuspec_name = next(name for name in archive.namelist() if name.endswith(".nuspec"))
              root = ET.fromstring(archive.read(nuspec_name))
          namespace = {"n": "http://schemas.microsoft.com/packaging/2015/06/nuspec.xsd"}
          actual = root.findtext("n:metadata/n:version", namespaces=namespace)
          if actual != version:
              raise SystemExit(f"Package version {actual!r} does not match release version {version!r}")
          print(f"Validated Chocolatey package v{actual}")
          PY
      - name: Publish package to Chocolatey Gallery
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
          VERSION: ${{ needs.release-gate.outputs.version }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CHOCOLATEY_API_KEY)) {
            throw "CHOCOLATEY_API_KEY is required to publish the Chocolatey package."
          }
          $package = "dist/releases/v$env:VERSION/mantra.$env:VERSION.nupkg"
          choco push $package --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey publish failed with exit code $LASTEXITCODE" }

  publish-homebrew:
    name: Publish Homebrew formula
    needs: [release-gate, publish-release]
    if: needs.publish-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout released source
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.release-gate.outputs.version }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download release assets and generate Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release-gate.outputs.version }}
        run: |
          mkdir -p dist/release-assets
          gh release download "v$VERSION" --dir dist/release-assets
          python scripts/release/generate_homebrew_formula.py "$VERSION" dist/release-assets dist/mantra.rb
          ruby -c dist/mantra.rb
      - name: Push formula to Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.release-gate.outputs.version }}
        shell: bash
        run: |
          if [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "HOMEBREW_TAP_TOKEN is required to deploy the Homebrew formula." >&2
            exit 1
          fi
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          TARGET=""
          for REPOSITORY in solotrondigital/homebrew-tap solotrontech/homebrew-tap; do
            if git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${REPOSITORY}.git" "$TMP_DIR/tap" 2>/dev/null; then
              TARGET="$REPOSITORY"
              break
            fi
            rm -rf "$TMP_DIR/tap"
          done
          if [[ -z "$TARGET" ]]; then
            echo "Could not clone the configured Homebrew tap repository." >&2
            exit 1
          fi
          cd "$TMP_DIR/tap"
          BRANCH=main
          if ! git ls-remote --exit-code --heads origin main >/dev/null 2>&1; then BRANCH=master; fi
          git checkout -B "$BRANCH" "origin/$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p Formula
          cp "$GITHUB_WORKSPACE/dist/mantra.rb" Formula/mantra.rb
          git add Formula/mantra.rb
          if ! git diff --cached --quiet; then
            git commit -m "feat(formula): bump mantra to v$VERSION"
            git push origin "HEAD:$BRANCH"
          else
            echo "Homebrew formula is already current at v$VERSION."
          fi
