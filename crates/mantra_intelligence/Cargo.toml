[package]
name = "mantra_intelligence"
version.workspace = true
edition = "2021"
authors = ["Solotron Technologies Private Limited"]
description = "Mantra Intelligence (MVP 2) — AI-driven coding intelligence engine, context analysis, code completion, error explanation, quick fixes, test generation, and doc generation"
license = "MIT OR GPL-3.0-or-later"

[dependencies]
mantrac_lexer   = { path = "../mantrac_lexer" }
mantrac_ast     = { path = "../mantrac_ast" }
mantrac_parser  = { path = "../mantrac_parser" }
mantrac_checker = { path = "../mantrac_checker" }
mantra_ai       = { path = "../mantra_ai" }
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"

