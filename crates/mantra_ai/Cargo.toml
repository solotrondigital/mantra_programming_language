[package]
name = "mantra_ai"
version.workspace = true
edition = "2021"
authors = ["Solotron Technologies Private Limited"]
description = "Native AI integration package for the Mantra Programming Language — Model Registry, Unified Providers (OpenAI, Gemini, Anthropic), Structured Output, Streaming, and Configuration"
license = "MIT OR GPL-3.0-or-later"

[dependencies]
reqwest = { version = "0.13", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

