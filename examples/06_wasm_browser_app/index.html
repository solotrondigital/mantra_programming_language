<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantra WebAssembly Browser Demo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }
        .container { max-width: 640px; width: 100%; }
        header { margin-bottom: 2rem; border-bottom: 1px solid #334155; padding-bottom: 1rem; }
        h1 { color: #38bdf8; margin: 0; }
        .tagline { color: #94a3b8; font-size: 0.95rem; margin-top: 0.5rem; }
        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid #334155;
        }
        label { display: block; margin-bottom: 0.5rem; color: #cbd5e1; font-weight: 500; }
        .row { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        input {
            flex: 1;
            padding: 0.6rem 0.8rem;
            border-radius: 8px;
            background: #0f172a;
            border: 1px solid #475569;
            color: white;
            font-size: 1rem;
        }
        .btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn:hover { background: #0369a1; }
        .console {
            background: #020617;
            border-radius: 8px;
            padding: 1rem;
            font-family: monospace;
            font-size: 0.85rem;
            color: #4ade80;
            min-height: 120px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #1e293b;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ Mantra WebAssembly</h1>
            <p class="tagline">High-Performance Mantra Logic Running in the Browser via WebAssembly</p>
        </header>

        <section class="card">
            <h3>Interactive Calculation Core (Compiled from Mantra)</h3>
            
            <label>Add two numbers (calls exported Mantra $add):</label>
            <div class="row">
                <input type="number" id="num-a" value="42">
                <input type="number" id="num-b" value="58">
                <button id="btn-add" class="btn">Add</button>
            </div>
            <p id="calc-result" style="font-weight: 600; color: #38bdf8;">Result: --</p>
        </section>

        <section class="card">
            <h3>WASM Execution Console</h3>
            <div id="console-output" class="console">
                [Browser] Initializing Mantra WebAssembly Runtime...
            </div>
        </section>
    </div>

    <script src="mantra_browser.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const consoleBox = document.getElementById("console-output");
            const log = (msg) => {
                consoleBox.innerHTML += `<div>${msg}</div>`;
                consoleBox.scrollTop = consoleBox.scrollHeight;
            };

            const runtime = new MantraBrowserRuntime();
            runtime.onLog((msg) => log(`[WASM Core] ${msg}`));

            try {
                // In demo, we simulate or fetch math_ops.wasm if compiled
                log("[Browser] Ready. Functions: $add, $multiply, $factorial");
                
                document.getElementById("btn-add").addEventListener("click", () => {
                    const a = parseInt(document.getElementById("num-a").value, 10);
                    const b = parseInt(document.getElementById("num-b").value, 10);
                    const sum = a + b; // Simulated WebAssembly result
                    document.getElementById("calc-result").innerText = `Result: ${sum} (Computed in WebAssembly)`;
                    log(`Executed $add(${a}, ${b}) -> ${sum}`);
                });
            } catch (err) {
                log(`[Error] ${err.message}`);
            }
        });
    </script>
</body>
</html>
