[project]
name = "ai_assistant_app"
org = "com.acme"
version = "0.1.0"
type = "standalone"
description = "Mantra standalone application: ai_assistant_app"
entry = "src/main.mantra"
license = "MIT"


[dependencies]
mantra_ai = "0.7.0"

[ai]
default_provider = "openai"
default_model = "assistant"
timeout_ms = 30000
max_retries = 3

[ai.models.assistant]
provider = "openai"
name = "gpt-4o"
env = "OPENAI_API_KEY"
temperature = 0.7
max_tokens = 2048

[ai.models.analyst]
provider = "gemini"
name = "gemini-1.5-pro"
env = "GEMINI_API_KEY"
temperature = 0.2
max_tokens = 4096

[ai.models.coder]
provider = "anthropic"
name = "claude-3-5-sonnet"
env = "ANTHROPIC_API_KEY"
temperature = 0.1
max_tokens = 8192

[build]
entry = "src/main.mantra"

