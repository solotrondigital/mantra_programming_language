[project]
name = "ai_ram_assistant_app"
org = "com.acme"
version = "0.1.0"
type = "ai"
description = "Mantra AI application: ai_ram_assistant_app"
entry = "src/main.mantra"

[dependencies]
"mantra.ai" = "0.7.0"
"mantra.util" = "0.7.0"

[ai]
default_provider = "openai"
default_model = "assistant"
timeout_ms = 30000
max_retries = 3

[ai.models.assistant]
provider = "openai"
name = "gpt-4o"
api_key = "sk-proj--"
env = "OPENAI_API_KEY"
temperature = 0.7
max_tokens = 2048

[ai.models.analyst]
provider = "gemini"
name = "gemini-1.5-pro"
api_key = "AIzaSy..."
env = "GEMINI_API_KEY"
temperature = 0.2
max_tokens = 4096

[ai.models.coder]
provider = "anthropic"
name = "claude-3-5-sonnet"
api_key = "sk-ant-..."
env = "ANTHROPIC_API_KEY"
temperature = 0.1
max_tokens = 8192
